[platformio]
default_envs = esp32-s3-4mb

[env:esp32-s3-4mb]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

; Bluepad32 is shipped inside a special Arduino-ESP32 core.
; This overrides PlatformIO’s default Arduino core with that core. :contentReference[oaicite:3]{index=3}
platform_packages =
  framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32/archive/refs/heads/main.zip


build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; --- FORCE 4MB FLASH BUILD + 4MB PARTITIONS ---
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv

lib_deps =
  adafruit/Adafruit NeoPixel@^1.12.0
